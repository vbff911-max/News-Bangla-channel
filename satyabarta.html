<style>
:root{--ac:#c8102e;--bg:#f6f6f4;--sf:#fff;--tx:#161616;--mt:#666;--bd:#e4e4e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f10;--sf:#1a1a1c;--tx:#f0f0ee;--mt:#9a9a9a;--bd:#2c2c2f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f10;--sf:#1a1a1c;--tx:#f0f0ee;--mt:#9a9a9a;--bd:#2c2c2f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
.w{max-width:1100px;margin:0 auto;padding:0 14px}
header{background:var(--sf);border-bottom:3px solid var(--ac);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top{display:flex;align-items:center;gap:8px;padding:10px 0}
.logo{font-family:'Noto Serif Bengali',serif;font-weight:800;font-size:28px;color:var(--ac);line-height:1.1;cursor:pointer}
.tag{font-size:12px;color:var(--mt)}.sp{flex:1}
.ib{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:7px 11px;font:inherit;font-size:14px;cursor:pointer}
.ib.on{background:var(--ac);color:#fff;border-color:var(--ac)}
nav{display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--bd)}
nav button{flex:none;border:0;background:none;color:var(--tx);font:inherit;font-weight:600;padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent}
nav button.a{color:var(--ac);border-color:var(--ac)}
.tk{display:flex;background:#111;color:#fff;font-size:14px;overflow:hidden}
.tk b{background:var(--ac);padding:6px 12px;flex:none;z-index:1}
.tk div{white-space:nowrap;padding:6px 0;animation:mq 40s linear infinite}
.tk span{margin:0 28px}
@keyframes mq{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.tk div{animation:none}}
main{padding:16px 0 100px;min-height:60vh}
h2.st{font-family:'Noto Serif Bengali',serif;font-size:20px;margin:22px 0 10px;border-left:5px solid var(--ac);padding-left:10px}
.lead{display:grid;gap:14px}@media(min-width:800px){.lead{grid-template-columns:2fr 1fr}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.card img,.card video{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#222}
.card .ph{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif Bengali',serif;font-size:44px;color:#fff;background:linear-gradient(135deg,var(--ac),#1a1a2e)}
.card .b{padding:10px 12px 12px}.card h3{margin:0 0 4px;font-size:17px;line-height:1.35}
.card.big h3{font-size:24px;font-family:'Noto Serif Bengali',serif}
.meta{font-size:12px;color:var(--mt)}
.chip{display:inline-block;background:var(--ac);color:#fff;font-size:11px;padding:1px 8px;border-radius:20px;margin-right:6px}
.pl{position:absolute;top:8px;right:8px;background:#000a;color:#fff;border-radius:20px;padding:2px 10px;font-size:12px}
.side{display:grid;gap:10px;align-content:start}.side .card{display:flex}
.side .card img,.side .card .ph{width:110px;aspect-ratio:1;flex:none;font-size:24px}
.sr{width:100%;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:12px}
.rg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.rep{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer}
.av{width:72px;height:72px;border-radius:50%;margin:0 auto 6px;background:var(--bd);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:26px}
.rep b{display:block}.rep small{color:var(--mt)}
.lv{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#0a8f3c;font-weight:700}
.lv::before{content:"";width:8px;height:8px;border-radius:50%;background:#0a8f3c;animation:bk 1.2s infinite}
.lv.off{color:var(--mt)}.lv.off::before{background:var(--mt);animation:none}
@keyframes bk{50%{opacity:.25}}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stats div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:13px}.stats b{font-size:20px;color:var(--ac);display:block}
.ep{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.ep .card img{aspect-ratio:3/4}
footer{background:#111;color:#bbb;padding:22px 0 110px;font-size:13px;text-align:center}
#bar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:2px solid var(--ac);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:6px;overflow-x:auto;z-index:40}
#bar.on{display:flex}#bar button{flex:none}
#md{position:fixed;inset:0;background:#000a;display:none;z-index:50;overflow:auto;padding:16px 10px}#md.on{display:block}
#mb{background:var(--sf);max-width:640px;margin:0 auto;border-radius:14px;padding:16px;position:relative}
.x{position:absolute;top:8px;right:10px;font-size:28px;border:0;background:none;color:var(--tx);cursor:pointer}
#mb h1{font-family:'Noto Serif Bengali',serif;font-size:23px;line-height:1.35;margin:6px 28px 8px 0}
#mb img,#mb video{width:100%;border-radius:10px;margin:8px 0}
.tx{white-space:pre-wrap;font-size:17px}
label{display:block;font-size:13px;color:var(--mt);margin-top:10px}
input,select,textarea{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:10px;font:inherit}
label.up{display:block;border:2px dashed var(--ac);color:var(--ac);border-radius:10px;padding:14px;text-align:center;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px}
.pr{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 18px;font:inherit;font-weight:700;margin:14px 8px 0 0;cursor:pointer}.pr.dg{background:#555}
.em{color:var(--mt);padding:30px 0;text-align:center}
#ts{position:fixed;left:10px;right:10px;bottom:90px;background:#222;color:#fff;padding:12px;border-radius:10px;z-index:99;text-align:center;display:none}
</style>
</head>
<body>
<header><div class="w">
<div class="top"><div><div class="logo" id="logo" onclick="go('home')"></div><div class="tag" id="tag"></div></div><div class="sp"></div><button class="ib" onclick="srt()">🔍</button><button class="ib" id="eb" onclick="edt()">✏️ এডিটর</button></div>
<nav id="nv"></nav></div></header>
<div class="tk"><b>ব্রেকিং</b><div id="tkr"></div></div>
<main class="w"><input class="sr" id="sr" placeholder="খবর খুঁজুন…" style="display:none" oninput="render()"><div id="app"></div></main>
<footer><div class="w"><div id="fn" style="font-size:18px;color:#fff"></div><div>সম্পাদক ও প্রকাশক: আপনার নাম · ঢাকা, বাংলাদেশ · info@example.com</div><div>© সর্বস্বত্ব সংরক্ষিত</div></div></footer>
<div id="bar"><button class="ib" onclick="newsF()">＋ সংবাদ</button><button class="ib" onclick="mediaF('v')">＋ ভিডিও</button><button class="ib" onclick="mediaF('a')">＋ অডিও</button><button class="ib" onclick="epF()">＋ ই-পেপার</button><button class="ib" onclick="brkF()">ব্রেকিং</button><button class="ib" onclick="setF()">⚙ সেটিং</button></div>
<div id="ts"></div>
<div id="md" onclick="if(event.target===this)cm()"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['জাতীয়','আন্তর্জাতিক','রাজনীতি','অর্থনীতি','খেলা','বিনোদন','প্রযুক্তি'];
const DIV={'ঢাকা':'ঢাকা,গাজীপুর,নারায়ণগঞ্জ,নরসিংদী,মানিকগঞ্জ,মুন্সীগঞ্জ,কিশোরগঞ্জ,টাঙ্গাইল,ফরিদপুর,গোপালগঞ্জ,মাদারীপুর,রাজবাড়ী,শরীয়তপুর','চট্টগ্রাম':'চট্টগ্রাম,কক্সবাজার,কুমিল্লা,ব্রাহ্মণবাড়িয়া,চাঁদপুর,ফেনী,নোয়াখালী,লক্ষ্মীপুর,রাঙ্গামাটি,খাগড়াছড়ি,বান্দরবান','রাজশাহী':'রাজশাহী,বগুড়া,নওগাঁ,নাটোর,চাঁপাইনবাবগঞ্জ,জয়পুরহাট,পাবনা,সিরাজগঞ্জ','খুলনা':'খুলনা,বাগেরহাট,সাতক্ষীরা,যশোর,নড়াইল,মাগুরা,ঝিনাইদহ,কুষ্টিয়া,চুয়াডাঙ্গা,মেহেরপুর','বরিশাল':'বরিশাল,ভোলা,পটুয়াখালী,পিরোজপুর,ঝালকাঠি,বরগুনা','সিলেট':'সিলেট,মৌলভীবাজার,হবিগঞ্জ,সুনামগঞ্জ','রংপুর':'রংপুর,দিনাজপুর,গাইবান্ধা,কুড়িগ্রাম,লালমনিরহাট,নীলফামারী,পঞ্চগড়,ঠাকুরগাঁও','ময়মনসিংহ':'ময়মনসিংহ,জামালপুর,নেত্রকোণা,শেরপুর'};
const ALLD=Object.values(DIV).join(',').split(',');
const TPL=[['ক্লাসিক লাল','#c8102e'],['নীল সংবাদ','#0b5ed7'],['সবুজ','#0a8f3c'],['কমলা','#e8590c'],['বেগুনি','#6f42c1'],['কালো প্রিমিয়াম','#222222']];
const today=()=>new Date().toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'});
const smp=(i,t,c)=>({id:'s'+i,t,c,b:'এটি একটি নমুনা সংবাদ। এডিটর মোডে গিয়ে নিজের সংবাদ, ছবি ও ভিডিও যোগ করুন এবং এটি মুছে ফেলুন।',d:today()});
let S;try{S=JSON.parse(localStorage.getItem('bn')||'null')}catch(e){}
S=S||{name:'সত্যবার্তা',tag:'সত্য ও নির্ভীক সংবাদের প্রতিশ্রুতি',color:'#c8102e',pin:'1234',brk:['স্বাগতম! এডিটর মোডে গিয়ে ব্রেকিং নিউজ পরিবর্তন করুন','৬৪ জেলার প্রতিনিধিদের সঙ্গে যুক্ত হোন'],news:[['রাজধানীতে নতুন উন্নয়ন প্রকল্পের উদ্বোধন','জাতীয়'],['বিশ্ব অর্থনীতিতে নতুন মোড়: বিশেষজ্ঞদের বিশ্লেষণ','আন্তর্জাতিক'],['সংসদে গুরুত্বপূর্ণ বিল নিয়ে আলোচনা','রাজনীতি'],['শেয়ারবাজারে ইতিবাচক প্রবণতা','অর্থনীতি'],['জাতীয় দলের জয়ে উচ্ছ্বাস','খেলা'],['নতুন সিনেমার ট্রেলার প্রকাশ','বিনোদন'],['কৃত্রিম বুদ্ধিমত্তার নতুন সম্ভাবনা','প্রযুক্তি']].map((a,i)=>smp(i,a[0],a[1])),vids:[],aud:[],ep:[],reps:{}};
S.aud=S.aud||[];
let tab='home',ed=false;try{ed=localStorage.getItem('bned')==='1'}catch(e){}
const save=()=>{try{localStorage.setItem('bn',JSON.stringify(S))}catch(e){toast('স্টোরেজ ভরে গেছে – পুরনো ছবি/সংবাদ মুছুন')}};
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}
const db=new Promise(r=>{try{const q=indexedDB.open('bnm',1);q.onupgradeneeded=()=>q.result.createObjectStore('m');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const idb=async(m,k,v)=>{const d=await db;if(!d)return;return new Promise(r=>{const o=d.transaction('m',m==='get'?'readonly':'readwrite').objectStore('m');const q=m==='get'?o.get(k):m==='put'?o.put(v,k):o.delete(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})};
const rz=(f,m=900)=>new Promise(r=>{const i=new Image;i.onload=()=>{const s=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)});
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const F=(id,acc,t)=>`<label class="up">📁 ${t}<input id="${id}" type="file" accept="${acc}" hidden onchange="if(this.files[0])this.parentNode.firstChild.nodeValue='✔ '+this.files[0].name"></label>`;
const tabs=[['home','সর্বশেষ'],...CATS.map(c=>[c,c]),['video','ভিডিও'],['audio','অডিও'],['epaper','ই-পেপার'],['reps','জেলা প্রতিনিধি']];
function go(t){tab=t;render();scrollTo(0,0)}
function srt(){const s=$('#sr');s.style.display=s.style.display==='none'?'block':'none';if(s.style.display==='block')s.focus()}
function setEd(v){ed=v;try{localStorage.setItem('bned',v?'1':'0')}catch(e){}render()}
function edt(){if(ed)setEd(false);else modal('<h1>এডিটর পিন</h1><p class="meta">প্রথমবার পিন: 1234</p><input id="pp" type="password" inputmode="numeric" placeholder="পিন লিখুন"><div id="pe" style="color:#c00;margin-top:6px"></div><button class="pr" onclick="pinC()">প্রবেশ করুন</button>')}
function pinC(){if($('#pp').value!==S.pin){$('#pe').textContent='পিন ভুল হয়েছে';return}cm();setEd(true)}
function cm(){$('#md').classList.remove('on');$('#mb').innerHTML=''}
function modal(h){$('#mb').innerHTML='<button class="x" onclick="cm()">×</button>'+h;$('#md').classList.add('on');hyd()}
async function hyd(){document.querySelectorAll('[data-v]').forEach(async v=>{if(v.src)return;const b=await idb('get',v.dataset.v);if(b)v.src=URL.createObjectURL(b)})}
const card=(n,big)=>`<article class="card ${big?'big':''}" onclick="openN('${n.id}')">${n.img?`<img loading="lazy" alt="" src="${n.img}">`:`<div class="ph">${E(n.t[0])}</div>`}${n.vid?'<span class="pl">▶ ভিডিও</span>':''}<div class="b"><h3>${E(n.t)}</h3><div class="meta"><span class="chip">${E(n.c)}</span>${E(n.d)}</div></div></article>`;
const del=(f,id)=>ed?` <a href="#" onclick="${f}('${id}');return false">🗑 মুছুন</a>`:'';
const vc=v=>`<div class="card"><video controls preload="metadata" playsinline data-v="${v.id}"></video><div class="b"><h3>${E(v.t)}</h3><div class="meta">${E(v.d)}${del('delM',v.id)}</div></div></div>`;
const ac=a=>`<div class="card"><div class="b"><h3>🎧 ${E(a.t)}</h3><audio controls preload="metadata" data-v="${a.id}" style="width:100%"></audio><div class="meta">${E(a.d)}${del('delM',a.id)}</div></div></div>`;
const grid=(l,f)=>l.length?`<div class="grid">${l.map(f).join('')}</div>`:'';
function render(){
 $('#logo').innerHTML=S.logo?`<img src="${S.logo}" alt="${E(S.name)}" style="height:36px;display:block">`:E(S.name);$('#tag').textContent=S.tag;$('#fn').textContent=S.name;
 document.documentElement.style.setProperty('--ac',S.color);document.title=S.name+' – সর্বশেষ বাংলা সংবাদ, ব্রেকিং নিউজ';
 $('#tkr').innerHTML=S.brk.map(b=>`<span>● ${E(b)}</span>`).join('');
 $('#bar').classList.toggle('on',ed);$('#eb').classList.toggle('on',ed);$('#eb').textContent=ed?'✔ এডিটর চালু':'✏️ এডিটর';
 $('#nv').innerHTML=tabs.map(t=>`<button class="${tab===t[0]?'a':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 const q=$('#sr').value.trim(),A=$('#app'),n=S.news,em=t=>`<div class="em">${t}</div>`;
 if(q){const r=n.filter(x=>(x.t+x.b).includes(q));A.innerHTML=r.length?grid(r,x=>card(x)):em('কিছু পাওয়া যায়নি');return}
 if(tab==='home')A.innerHTML=n.length?(S.banner?`<img alt="" src="${S.banner}" style="width:100%;border-radius:10px;margin-bottom:12px">`:'')+`<div class="lead">${card(n[0],1)}<div class="side">${n.slice(1,4).map(x=>card(x)).join('')}</div></div>`+(n.length>4?`<h2 class="st">আরও খবর</h2>${grid(n.slice(4),x=>card(x))}`:'')+(S.vids.length?`<h2 class="st">ভিডিও</h2>${grid(S.vids.slice(0,3),vc)}`:''):em('এখনও কোনো সংবাদ নেই। এডিটর মোড থেকে যোগ করুন।');
 else if(tab==='video')A.innerHTML=`<h2 class="st">ভিডিও গ্যালারি</h2>`+(grid(S.vids,vc)||em('কোনো ভিডিও নেই। এডিটর মোডে ফোন গ্যালারি থেকে আপলোড করুন।'));
 else if(tab==='audio')A.innerHTML=`<h2 class="st">অডিও</h2>`+(grid(S.aud,ac)||em('কোনো অডিও নেই।'));
 else if(tab==='epaper')A.innerHTML=`<h2 class="st">ই-পেপার</h2>`+(S.ep.length?`<div class="ep">${S.ep.map(e=>`<div class="card" onclick="openE('${e.id}')"><img alt="" src="${e.img}"><div class="b"><b>${E(e.t)}</b><div class="meta">${E(e.d)}</div></div></div>`).join('')}</div>`:em('কোনো ই-পেপার নেই।'));
 else if(tab==='reps')repsV(A);
 else{const f=n.filter(x=>x.c===tab);A.innerHTML=`<h2 class="st">${E(tab)}</h2>`+(grid(f,x=>card(x))||em('এই বিভাগে কোনো সংবাদ নেই।'))}
 hyd()}
function repsV(A){const k=Object.values(S.reps).filter(r=>r.name).length,l=Object.values(S.reps).filter(r=>r.live).length;
 A.innerHTML=`<h2 class="st">৬৪ জেলার প্রতিনিধি</h2><div class="stats"><div><b>৬৪</b>জেলা</div><div><b>${k}</b>নিযুক্ত প্রতিনিধি</div><div><b>${l}</b>লাইভ অনলাইন</div></div><button class="pr" onclick="repF('')">＋ প্রতিনিধি সদস্য নিবন্ধন</button>`+Object.entries(DIV).map(([dv,ds])=>`<h2 class="st">${dv} বিভাগ</h2><div class="rg">${ds.split(',').map(d=>{const r=S.reps[d]||{};return `<div class="rep" onclick="${ed?'repF':'repV'}('${d}')">${r.img?`<img class="av" alt="" src="${r.img}">`:'<div class="av">👤</div>'}<b>${E(r.name||'পদ খালি')}</b><small>${d} জেলা</small><br><span class="lv ${r.live?'':'off'}">${r.live?'লাইভ':'অফলাইন'}</span></div>`}).join('')}</div>`).join('')}
function repV(d){const r=S.reps[d]||{};modal(`<h1>${d} জেলা প্রতিনিধি</h1>${r.img?`<img alt="" src="${r.img}" style="max-width:240px;display:block;margin:auto">`:''}<p><b>${E(r.name||'এই জেলায় প্রতিনিধি নেই')}</b><br>${E(r.role||'')}<br>${r.phone?`<a href="tel:${E(r.phone)}">📞 ${E(r.phone)}</a>`:''}</p><span class="lv ${r.live?'':'off'}">${r.live?'লাইভ অনলাইন':'অফলাইন'}</span>${r.name?'':`<p><button class="pr" onclick="repF('${d}')">এই জেলায় নিবন্ধন করুন</button></p>`}`)}
function repF(d){const r=S.reps[d]||{};modal(`<h1>${ed?'প্রতিনিধি সম্পাদনা':'সদস্য নিবন্ধন'}</h1><label>জেলা</label><select id="rd">${ALLD.map(x=>`<option ${x===d?'selected':''}>${x}</option>`).join('')}</select><label>নাম</label><input id="rn" value="${E(r.name)}"><label>পদবি</label><input id="rr" value="${E(r.role||'জেলা প্রতিনিধি')}"><label>মোবাইল</label><input id="rp" type="tel" value="${E(r.phone)}"><label>ছবি</label>${F('ri','image/*','গ্যালারি থেকে ছবি বাছুন')}<label><input id="rl" type="checkbox" style="width:auto" ${r.live?'checked':''}> লাইভ অনলাইন</label><button class="pr" onclick="repS()">সংরক্ষণ</button>${ed&&r.name?`<button class="pr dg" onclick="repD('${d}')">মুছুন</button>`:''}`)}
async function repS(){const d=$('#rd').value,o=S.reps[d]||{},f=$('#ri').files[0];if(!$('#rn').value.trim())return toast('নাম দিন');S.reps[d]={name:$('#rn').value.trim(),role:$('#rr').value,phone:$('#rp').value,live:$('#rl').checked,img:f?await rz(f,300):o.img};save();cm();tab='reps';render()}
function repD(d){delete S.reps[d];save();cm();render()}
function openN(id){const n=S.news.find(x=>x.id===id);if(!n)return;modal(`<span class="chip">${E(n.c)}</span><span class="meta">${E(n.d)}</span><h1>${E(n.t)}</h1>${n.img?`<img alt="" src="${n.img}">`:''}${n.vid?`<video controls playsinline data-v="${n.vid}"></video>`:''}<div class="tx">${E(n.b)}</div><p>${navigator.share?`<button class="pr" onclick="navigator.share({title:document.title,url:location.href})">শেয়ার</button>`:''}${ed?`<button class="pr dg" onclick="newsF('${id}')">সম্পাদনা</button><button class="pr dg" onclick="delN('${id}')">মুছুন</button>`:''}</p>`)}
function openE(id){const e=S.ep.find(x=>x.id===id);modal(`<h1>${E(e.t)}</h1><img alt="" src="${e.img}">${ed?`<button class="pr dg" onclick="S.ep=S.ep.filter(x=>x.id!=='${id}');save();cm();render()">মুছুন</button>`:''}`)}
function newsF(id){const n=S.news.find(x=>x.id===id)||{};modal(`<h1>${id?'সংবাদ সম্পাদনা':'নতুন সংবাদ'}</h1><label>শিরোনাম</label><input id="nt" value="${E(n.t)}"><label>বিভাগ</label><select id="nc">${CATS.map(c=>`<option ${c===n.c?'selected':''}>${c}</option>`).join('')}</select><label>বিস্তারিত</label><textarea id="nb" rows="8">${E(n.b)}</textarea><label>ছবি</label>${F('ni','image/*','গ্যালারি/ক্যামেরা থেকে ছবি')}<label>ভিডিও</label>${F('nv2','video/*','গ্যালারি থেকে ভিডিও')}<button class="pr" onclick="newsS('${id||''}')">প্রকাশ করুন</button>`)}
async function newsS(id){const t=$('#nt').value.trim();if(!t)return toast('শিরোনাম দিন');let n=S.news.find(x=>x.id===id);if(!n){n={id:uid(),d:today()};S.news.unshift(n)}
 n.t=t;n.c=$('#nc').value;n.b=$('#nb').value;const i=$('#ni').files[0],v=$('#nv2').files[0];if(i)n.img=await rz(i);if(v){n.vid=n.vid||uid();await idb('put',n.vid,v)}save();cm();render()}
function delN(id){const n=S.news.find(x=>x.id===id);if(n&&n.vid)idb('del',n.vid);S.news=S.news.filter(x=>x.id!==id);save();cm();render()}
function mediaF(k){modal(`<h1>${k==='v'?'ভিডিও':'অডিও'} আপলোড</h1><label>শিরোনাম</label><input id="mt">${F('mf',k==='v'?'video/*':'audio/*','ফোন থেকে ফাইল বাছুন')}<button class="pr" onclick="mediaS('${k}')">আপলোড</button>`)}
async function mediaS(k){const f=$('#mf').files[0],t=$('#mt').value.trim();if(!f||!t)return toast('শিরোনাম ও ফাইল দিন');const id=uid();await idb('put',id,f);(k==='v'?S.vids:S.aud).unshift({id,t,d:today()});save();cm();tab=k==='v'?'video':'audio';render()}
function delM(id){idb('del',id);S.vids=S.vids.filter(v=>v.id!==id);S.aud=S.aud.filter(v=>v.id!==id);save();render()}
function epF(){modal(`<h1>ই-পেপার পাতা</h1><label>শিরোনাম (যেমন: প্রথম পাতা)</label><input id="et">${F('ef','image/*','পাতার ছবি বাছুন')}<button class="pr" onclick="epS()">যোগ করুন</button>`)}
async function epS(){const f=$('#ef').files[0];if(!f)return toast('ছবি দিন');S.ep.unshift({id:uid(),t:$('#et').value||'পাতা',d:today(),img:await rz(f,1400)});save();cm();tab='epaper';render()}
function brkF(){modal(`<h1>ব্রেকিং নিউজ (প্রতি লাইনে একটি)</h1><textarea id="bk" rows="6">${E(S.brk.join('\n'))}</textarea><button class="pr" onclick="S.brk=$('#bk').value.split('\n').filter(Boolean);save();cm();render()">সংরক্ষণ</button>`)}
function setF(){modal(`<h1>সাইট সেটিং</h1><label>ওয়েবসাইটের নাম</label><input id="sn" value="${E(S.name)}"><label>ট্যাগলাইন</label><input id="sg" value="${E(S.tag)}"><label>রেডিমেড টেমপ্লেট</label><div style="display:flex;gap:6px;flex-wrap:wrap">${TPL.map(t=>`<button class="ib" style="border-color:${t[1]};color:${t[1]}" onclick="$('#sc').value='${t[1]}'">${t[0]}</button>`).join('')}</div><label>থিম রং</label><input id="sc" type="color" value="${S.color}"><label>লোগো</label>${F('sl','image/*','গ্যালারি থেকে লোগো')}<label>হোম ব্যানার/বিজ্ঞাপন</label>${F('sb','image/*','ব্যানার ছবি')}<label>এডিটর পিন</label><input id="sp" value="${E(S.pin)}"><button class="pr" onclick="setS()">সংরক্ষণ</button>`)}
async function setS(){S.name=$('#sn').value;S.tag=$('#sg').value;S.color=$('#sc').value;S.pin=$('#sp').value||'1234';const l=$('#sl').files[0],b=$('#sb').files[0];if(l)S.logo=await rz(l,300);if(b)S.banner=await rz(b,1200);save();cm();render()}
render();
</script>
</body>
</html>
